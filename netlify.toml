[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Old URLs from the previous site keep working.
[[redirects]]
  from = "/in_pg/about"
  to = "/about/"
  status = 301
[[redirects]]
  from = "/in_pg/about.html"
  to = "/about/"
  status = 301
[[redirects]]
  from = "/in_pg/board"
  to = "/team/"
  status = 301
[[redirects]]
  from = "/in_pg/board.html"
  to = "/team/"
  status = 301
[[redirects]]
  from = "/in_pg/events"
  to = "/news/"
  status = 301
[[redirects]]
  from = "/in_pg/events.html"
  to = "/news/"
  status = 301
[[redirects]]
  from = "/in_pg/careers"
  to = "/careers/"
  status = 301
[[redirects]]
  from = "/in_pg/careers.html"
  to = "/careers/"
  status = 301
[[redirects]]
  from = "/in_pg/downloads"
  to = "/resources/"
  status = 301
[[redirects]]
  from = "/in_pg/downloads.html"
  to = "/resources/"
  status = 301
[[redirects]]
  from = "/newsletter_hai"
  to = "/resources/"
  status = 301
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301

# Hashed build assets never change, so browsers can keep them for a year.
# Fewer repeat requests also means fewer Netlify credits used.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
